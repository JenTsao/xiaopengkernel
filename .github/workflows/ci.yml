name: CI Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 同一分支的新推送会取消仍在运行的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主线：Linux + Windows，Release，FreeType 开启 ──────────
  build-and-test:
    name: ${{ matrix.os }} · Release · FreeType
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 矩阵构建配置，同时覆盖 Linux 和 Windows
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # --- 0. 缓存 CMake FetchContent 依赖目录 ---
    - name: Cache CMake FetchContent
      uses: actions/cache@v4
      with:
        path: .cmake-deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    # --- 0.1 缓存 CMake 构建目录（增量构建加速） ---
    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        # 缓存 CMake 生成的 build 目录，命中后仅重新编译变更的目标
        path: build/
        # key 绑定 OS 与 CMakeLists 内容：配置变更时自动失效并重建缓存
        key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-build-

    # --- 1. Linux 构建依赖 ---
    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ build-essential libcurl4-openssl-dev libsdl2-dev libgl1-mesa-dev pkg-config libfreetype6-dev libharfbuzz-dev

    # --- 2. Windows MinGW 构建依赖 ---
    - name: Setup MinGW (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
        path-type: inherit
        cache: true

    # --- 配置 CMake ---
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      # ENABLE_FREETYPE=ON 使 FreeType/HarfBuzz 矢量字体代码路径纳入 CI 测试
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_FREETYPE=ON -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cmake-deps

    - name: Configure CMake (Windows MinGW)
      if: runner.os == 'Windows'
      # Windows 下使用 MinGW Makefiles，依赖由 third_party/ 打包提供
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DENABLE_FREETYPE=ON -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cmake-deps

    # --- 执行构建 ---
    - name: Build
      run: cmake --build build --config Release -j 4

    # --- 运行测试 ---
    - name: Run Tests (ctest)
      working-directory: build
      # 失败时显示详细日志；同时输出 JUnit 报告供上传
      run: ctest -C Release --output-on-failure --output-junit test-results.xml

    # --- 上传测试结果（JUnit） ---
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ runner.os }}
        path: build/test-results.xml
        if-no-files-found: ignore
        retention-days: 5

    # --- 上传构建产物 ---
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      # 即使构建或测试失败，也上传产物以便排查日志
      if: always()
      with:
        name: build-artifacts-${{ runner.os }}
        path: |
          build/
          !build/CMakeFiles/
          !build/**/*.o
          !build/**/*.obj
          !build/**/*.a
        retention-days: 5

  # ── Linux 配置矩阵：Debug 构建 + FreeType 关闭路径 ─────────
  # 覆盖默认配置（ENABLE_FREETYPE 默认 OFF）与 Debug 断言
  linux-variants:
    name: Linux · ${{ matrix.build_type }} · FreeType ${{ matrix.freetype }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            freetype: ON
          - build_type: Debug
            freetype: OFF
          - build_type: Release
            freetype: OFF

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ build-essential libcurl4-openssl-dev libsdl2-dev libgl1-mesa-dev pkg-config libfreetype6-dev libharfbuzz-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_FREETYPE=${{ matrix.freetype }}

    - name: Build
      run: cmake --build build -j 4

    - name: Run Tests (ctest)
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

  # ── 编译器矩阵：Clang ──────────────────────────────────────
  linux-clang:
    name: Linux · Clang Release · FreeType
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang build-essential libcurl4-openssl-dev libsdl2-dev libgl1-mesa-dev pkg-config libfreetype6-dev libharfbuzz-dev

    - name: Configure CMake (Clang)
      env:
        CC: clang
        CXX: clang++
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_FREETYPE=ON

    - name: Build
      run: cmake --build build -j 4

    - name: Run Tests (ctest)
      working-directory: build
      run: ctest -C Release --output-on-failure

  # ── 覆盖率报告（GCC + gcovr） ──────────────────────────────
  coverage:
    name: Coverage (GCC)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ build-essential libcurl4-openssl-dev libsdl2-dev libgl1-mesa-dev pkg-config libfreetype6-dev libharfbuzz-dev gcovr

    - name: Configure CMake (coverage instrumentation)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_FREETYPE=ON -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage

    - name: Build
      run: cmake --build build -j 4

    - name: Run Tests (ctest)
      working-directory: build
      run: ctest -C Debug --output-on-failure

    - name: Generate Coverage Report
      run: |
        mkdir -p coverage
        set -o pipefail
        gcovr --root . --filter 'include/' --filter 'src/' --xml coverage.xml --html-details coverage/index.html --print-summary | tee coverage-summary.txt

    - name: Append Coverage Summary
      run: |
        echo "### 代码覆盖率（include/ + src/）" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          coverage/
        retention-days: 5

  # ── 静态分析（cppcheck，非阻塞：仅报告不卡门禁） ────────────
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: |
        cppcheck -j 4 \
          --enable=warning,performance,portability \
          --inline-suppr \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --std=c++20 \
          -I include \
          include src 2>&1 | tee cppcheck-report.txt

    - name: Append Static Analysis Summary
      if: always()
      run: |
        echo "### cppcheck 静态分析（非阻塞）" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -50 cppcheck-report.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Static Analysis Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 5
